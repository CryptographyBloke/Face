name: Deploy API

# Manual only. Needs the CLOUDFLARE_API_TOKEN repository secret
# (and CLOUDFLARE_ACCOUNT_ID if the token can see several accounts).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx wrangler d1 migrations apply wallet-face --remote
      - run: npx wrangler deploy
