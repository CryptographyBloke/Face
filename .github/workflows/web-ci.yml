name: Web CI

on:
  push:
    paths:
      - "web/**"
      - "packages/sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run test:protocol
      - working-directory: web
        run: npm run build
